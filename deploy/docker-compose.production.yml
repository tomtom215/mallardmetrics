# =============================================================================
# Mallard Metrics — Production Docker Compose
# =============================================================================
#
# Usage:
#   1. Copy deploy/.env.example → deploy/.env and fill in every value.
#   2. Run deploy/setup.sh to provision the host (LUKS, firewall, Docker).
#   3. From the repo root:
#        docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env up -d
#
# Architecture:
#   Internet → caddy_external network → Caddy (TLS, reverse proxy)
#                                     → proxy network (internal-only)
#                                     → mallard-metrics (no internet access)
#
# Data is stored on the host at MALLARD_DATA_HOST_DIR (default: /srv/mallard/data).
# Run deploy/setup.sh first — it mounts that path on a LUKS-encrypted container
# and makes it writable by the container's uid (65532).
#
# Backups: see deploy/backup.sh. Do NOT copy the live data directory with
# rsync/cp while the mallard container runs: DuckDB's file and WAL are not
# consistent on disk until the process stops or checkpoints.
# =============================================================================

name: mallard-production

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ── Caddy ─────────────────────────────────────────────────────────────────
  # Custom build that includes the Cloudflare DNS provider module so Caddy
  # can complete the ACME DNS-01 challenge (required for wildcard certs and
  # for servers behind NAT or with no inbound port 80).
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    image: mallard-caddy:latest
    container_name: mallard-caddy
    restart: unless-stopped

    # Drop all Linux capabilities; re-add only what's needed to bind 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

    security_opt:
      - no-new-privileges:true

    # Read-only root FS. Caddy needs /tmp; /data and /config are named volumes.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

    # Caddy is on BOTH networks:
    #   caddy_external — faces the internet (ACME, incoming connections)
    #   proxy          — reaches Mallard on the internal network
    networks:
      - caddy_external
      - proxy

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 / QUIC

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    environment:
      DOMAIN:               ${DOMAIN}
      ACME_EMAIL:           ${ACME_EMAIL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}

    # Caddy's access and error logs go to stdout/stderr with the visitor's IP,
    # User-Agent, headers and query string removed (see the Caddyfile), so the
    # only retention is this size-based rotation.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    # Probes the loopback-only listener declared in the Caddyfile. The previous
    # check ran `caddy validate`, which only re-parses the file and succeeds
    # whether or not the server is up.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Wait for the backend so Caddy's first requests are not 502s, and so a
    # `up -d` reports a failed backend instead of hiding it.
    depends_on:
      mallard:
        condition: service_healthy

    mem_limit: 256m
    cpus: 1
    pids_limit: 256

  # ── Mallard Metrics ────────────────────────────────────────────────────────
  # The analytics backend. Built from the repo root Dockerfile (glibc,
  # distroless, UID 65532) or pulled from GHCR when MALLARD_IMAGE is set. No
  # port is published to the host — all traffic goes through Caddy on the
  # internal `proxy` network.
  #
  # A DuckDB build on a 1 GB VPS can run out of memory; set
  # MALLARD_IMAGE=ghcr.io/tomtom215/mallardmetrics:<version> in deploy/.env to
  # pull a released image instead (running setup.sh with MM_IMAGE=<image> does this).
  mallard:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${MALLARD_IMAGE:-mallard-metrics:latest}
    container_name: mallard-metrics
    restart: unless-stopped

    # The image already runs as 65532:65532; stating it here keeps it true if the
    # image is ever replaced, and matches the ownership setup.sh gives the data
    # directory.
    user: "65532:65532"

    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # The only writable path is /data (bind-mounted from the LUKS volume).
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # Resource limits. DuckDB defaults to ~80% of host RAM, so cap it below the
    # container limit: a heavy query then fails with an error instead of getting
    # the whole process, and with it event ingestion, OOM-killed.
    mem_limit: ${MALLARD_MEM_LIMIT:-2g}
    cpus: ${MALLARD_CPUS:-2}
    pids_limit: 256

    # The shutdown path flushes the in-memory event buffer, which can take up to
    # MALLARD_SHUTDOWN_TIMEOUT (30 s by default); Docker's default 10 s grace
    # period would SIGKILL the process mid-flush and lose the buffered events.
    stop_grace_period: 45s

    # Mallard is ONLY on the internal network — it has no internet access.
    # Caddy reaches it via the shared `proxy` network; the internet cannot
    # reach Mallard directly even if Caddy is misconfigured.
    #
    # This has one consequence worth knowing before you wonder why half the
    # dashboard says "Not available": the DuckDB `behavioral` extension is
    # downloaded on first run, and there is nowhere to download it from here, so
    # funnels, retention, sessions, sequences and flow answer 503. Seed it once
    # onto the data volume (setup.sh does this for you) and it is loaded from
    # disk from then on:
    #
    #   docker run --rm --user 65532:65532 \
    #     -v ${MALLARD_DATA_HOST_DIR:-/srv/mallard/data}:/data \
    #     mallard-metrics:latest --install-extension
    #
    # The image must be glibc-based: the extension is not published for musl.
    # Re-run this after any DuckDB upgrade (check /health/detailed for
    # `behavioral_version`). See docs/src/deploy-vps.md, "Seed the behavioral
    # extension".
    networks:
      - proxy

    volumes:
      # Bind-mount the LUKS-decrypted directory. setup.sh creates it, mounts it
      # and chowns it to 65532:65532.
      - type: bind
        source: ${MALLARD_DATA_HOST_DIR:-/srv/mallard/data}
        target: /data

    environment:
      MALLARD_DATA_DIR:  /data
      MALLARD_HOST:      0.0.0.0
      MALLARD_PORT:      8000

      # ---- Security (all required in production) ----
      MALLARD_SECRET:           ${MALLARD_SECRET}
      MALLARD_ADMIN_PASSWORD:   ${MALLARD_ADMIN_PASSWORD}
      MALLARD_DASHBOARD_ORIGIN: https://${DOMAIN}
      MALLARD_SECURE_COOKIES:   "true"
      MALLARD_METRICS_TOKEN:    ${MALLARD_METRICS_TOKEN}

      # ---- Client address (behind the bundled Caddy) ----
      # Mallard's only peer is the Caddy container. Without these, every
      # visitor shares Caddy's address: the login lockout is keyed by it (five
      # wrong passwords from anyone lock the admin out), unique visitors
      # collapse to distinct User-Agents, and GeoIP never resolves
      # (LESSONS.md, L31). Caddy overwrites X-Forwarded-For with the single
      # address it accepted the connection from, so exactly one hop is trusted.
      # MALLARD_TRUSTED_PROXY_HOPS requires a Mallard build that reads it;
      # older builds ignore it and take the leftmost entry, which is the same
      # address when Caddy is the only proxy.
      MALLARD_TRUST_PROXY_HEADERS: "true"
      MALLARD_TRUSTED_PROXY_HOPS:  "1"

      # ---- Behaviour ----
      # IMPORTANT: env var names must match config.rs exactly.
      # MALLARD_RATE_LIMIT       → config.rate_limit_per_site
      # MALLARD_CACHE_TTL        → config.cache_ttl_secs
      # MALLARD_GEOIP_DB         → config.geoip_db_path
      MALLARD_LOG_FORMAT:             json
      MALLARD_FILTER_BOTS:            "true"
      MALLARD_RETENTION_DAYS:         ${MALLARD_RETENTION_DAYS:-365}
      MALLARD_RATE_LIMIT:             ${MALLARD_RATE_LIMIT:-200}
      MALLARD_CACHE_TTL:              ${MALLARD_CACHE_TTL:-300}
      MALLARD_MAX_CONCURRENT_QUERIES: ${MALLARD_MAX_CONCURRENT_QUERIES:-10}
      MALLARD_MAX_LOGIN_ATTEMPTS:     ${MALLARD_MAX_LOGIN_ATTEMPTS:-5}
      MALLARD_LOGIN_LOCKOUT:          ${MALLARD_LOGIN_LOCKOUT:-300}
      MALLARD_SITE_IDS:               ${MALLARD_SITE_IDS:-}
      MALLARD_GEOIP_DB:               ${MALLARD_GEOIP_DB:-}
      MALLARD_DUCKDB_MEMORY_LIMIT:    ${MALLARD_DUCKDB_MEMORY_LIMIT:-1280MB}
      MALLARD_DUCKDB_THREADS:         ${MALLARD_DUCKDB_THREADS:-2}

      RUST_LOG: "mallard_metrics=info,tower_http=warn"

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"

    # The binary probes itself (`--healthcheck` -> /health/ready), so the
    # distroless image needs no shell or curl. The previous "disabled" setting
    # dated from the FROM scratch image, where the same exec-form check already
    # worked; disabling it only hid an unhealthy backend from `docker ps` and
    # from Caddy's depends_on.
    healthcheck:
      test: ["CMD", "/mallard-metrics", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Caddy-facing external network: allows outbound internet (ACME, DNS checks).
  # Only Caddy is on this network.
  caddy_external:
    driver: bridge
    internal: false

  # Internal-only network: Caddy ↔ Mallard communication.
  # internal: true means Docker does NOT add a default route to the host's
  # external interfaces, so Mallard cannot make outbound internet requests.
  # This limits blast radius if the Mallard container is ever compromised.
  proxy:
    driver: bridge
    internal: true

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  # Caddy uses these for ACME certificates and its internal config state.
  # Docker-managed named volumes (not on the LUKS data volume) so they survive
  # independent of the mallard data lifecycle.
  caddy-data:
    driver: local
  caddy-config:
    driver: local
