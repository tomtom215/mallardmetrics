<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Privacy-first web analytics">
    <title>Mallard Metrics</title>
    <!-- Without this the browser asks for /favicon.ico on every load, the
         catch-all asset route answers 404, and the tab shows a blank page icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css">
    <!-- The entry module imports these; naming them here lets the browser fetch
         all of them in parallel instead of discovering each one a round trip later. -->
    <link rel="modulepreload" href="/preact.js">
    <link rel="modulepreload" href="/htm.js">
    <link rel="modulepreload" href="/format.js">
    <link rel="modulepreload" href="/api.js">
</head>
<body>
    <div id="app">
        <!-- First paint: a static skeleton, replaced when the script runs. -->
        <div class="boot" role="status" aria-label="Loading the dashboard">
            <div class="boot-title">Mallard Metrics</div>
            <div class="skeleton boot-bar"></div>
            <div class="skeleton boot-panel"></div>
        </div>
    </div>
    <noscript>Mallard Metrics needs JavaScript to draw its dashboard.</noscript>
    <script type="module" src="/app.js"></script>
</body>
</html>
