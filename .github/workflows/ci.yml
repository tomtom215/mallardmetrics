# Continuous integration — enforces all quality gates.
#
# Jobs: test + clippy + fmt + doc (matrix), behavioral-extension tests,
#       smoke test, static checks, supply-chain policy, code coverage, Docker
#       image build + container smoke test, deployment config, release-binary
#       build + smoke test.
#
# Job dependency graph (all jobs run in parallel):
#
#   ci (4-entry matrix)
#   behavioral     # runs the DuckDB behavioral-extension-backed tests with
#                  # MALLARD_REQUIRE_BEHAVIORAL=1 so they fail rather than skip.
#   smoke          # the real binary on a real socket (behavioral required).
#   static-checks  # actionlint + shellcheck + JS syntax + tracker drift +
#                  # toolchain drift (Cargo.toml, rust-toolchain.toml, Dockerfile)
#   policy         # cargo-deny bans, licenses and sources. Advisories live in
#                  # security.yml so a new RustSec entry does not turn every
#                  # unrelated PR red; that workflow also runs weekly.
#   coverage
#   docker         # builds the image and runs scripts/docker-smoke.sh against it
#   deploy-config  # `docker compose config` for both compose files and
#                  # `caddy validate` of deploy/Caddyfile
#   release-build  # builds the glibc release binaries exactly as release.yml
#                  # does and smoke-tests them with the behavioral extension
#                  # required. A binary that cannot install the extension (a
#                  # musl build) fails here, not after the tag is pushed.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR — saves CI minutes when
# multiple commits are pushed in quick succession.  Main-branch pushes
# are NOT cancelled so merge builds always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

# ── Job 1: Lint, test, and compile (parallel matrix) ──────────────────────────
jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            command: cargo test --locked --all-targets && cargo test --locked --doc
          - name: Clippy
            components: clippy
            command: cargo clippy --locked --all-targets --all-features -- -D warnings
          - name: Format
            components: rustfmt
            command: cargo fmt -- --check
          - name: Documentation
            command: cargo doc --locked --no-deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.0"
          components: ${{ matrix.components || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}


# ── Job 2: Behavioral-extension integration tests ─────────────────────────────
#
# The DuckDB `behavioral` community extension is downloaded at test time.  Unit
# tests skip behavioral assertions when it cannot be loaded (offline dev), so CI
# sets MALLARD_REQUIRE_BEHAVIORAL=1 to turn those skips into hard failures —
# otherwise a regression in funnel/retention/session SQL would pass silently.
  behavioral:
    name: Behavioral extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run behavioral-backed tests
        env:
          MALLARD_REQUIRE_BEHAVIORAL: "1"
        run: cargo test --locked --all-targets

# ── Job 3: End-to-end smoke test against the real binary ──────────────────────
#
# The other jobs drive the router in-process. This one starts the executable on
# a socket with real configuration, a real DuckDB file and real Parquet on disk.
# Both a 500 on /api/stats/realtime and an unauthenticated /api/keys reached a
# fully green test suite before this existed.
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the binary
        run: cargo build --locked
      # MALLARD_REQUIRE_BEHAVIORAL=1: the extension must install and the five
      # behavioral endpoints must answer 200. Without it a binary that cannot
      # install the extension still passes (the endpoints answer 503).
      - name: Run the smoke test
        env:
          MALLARD_REQUIRE_BEHAVIORAL: "1"
        run: scripts/smoke-test.sh target/debug/mallard-metrics

# ── Job 4: Static checks (workflows, JS, asset drift) ─────────────────────────
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.7 -color

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          # The runner image ships with shellcheck preinstalled.
          shellcheck scripts/*.sh deploy/*.sh

      - name: Check the declared MSRV matches every place it is pinned
        run: |
          set -euo pipefail
          # There is no separate "build at MSRV" job: rust-version and the
          # pinned channel are the same version, so it would duplicate the Test
          # job exactly. That only holds while they agree, which is what this
          # checks — including the literals in the workflows, because a bump
          # that misses one silently tests a different compiler than it claims.
          CARGO_MSRV=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          PINNED=$(grep -m1 '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Cargo.toml rust-version: $CARGO_MSRV"
          echo "rust-toolchain.toml:     $PINNED"
          if [ "$CARGO_MSRV" != "$PINNED" ]; then
            echo "::error file=Cargo.toml::rust-version ($CARGO_MSRV) and rust-toolchain.toml channel ($PINNED) have drifted apart."
            exit 1
          fi

          status=0

          # The Dockerfile selects its compiler by the builder image's tag.
          DOCKER_RUST=$(grep -m1 -oE '^FROM rust:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | sed 's/.*://')
          echo "Dockerfile builder:      ${DOCKER_RUST:-<none>}"
          if [ "$DOCKER_RUST" != "$CARGO_MSRV" ]; then
            echo "::error file=Dockerfile::builder image pins Rust ${DOCKER_RUST:-<none>} but the MSRV is $CARGO_MSRV"
            status=1
          fi

          for wf in .github/workflows/*.yml; do
            while IFS= read -r version; do
              if [ "$version" != "$CARGO_MSRV" ]; then
                echo "::error file=$wf::pins toolchain $version but the MSRV is $CARGO_MSRV"
                status=1
              fi
            done < <(grep -oE '^ *toolchain: "[0-9.]+"' "$wf" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
          done
          exit "$status"

      - name: Check the demo-data script still matches the events schema
        run: python3 scripts/check-seed-schema.py

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for f in tracking/script.js tracking/extras.js src/dashboard/assets/app.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Check dashboard method references
        run: |
          set -euo pipefail
          # `node --check` validates syntax and says nothing about whether a
          # method exists, and the dashboard has no test harness — so a button
          # wired to a method that was renamed fails only when a user clicks it.
          node scripts/check-dashboard-methods.mjs src/dashboard/assets/app.js

      - name: Check the tracking script stays inside its size budget
        run: |
          set -euo pipefail
          # The README and the docs both claim "about 3 KB gzipped". The budget
          # is deliberately close to the current size: the script is served to
          # every visitor on every page, so growth should be a decision rather
          # than an accident.
          BUDGET=4096
          SIZE=$(gzip -9 -c tracking/script.js | wc -c)
          echo "tracking/script.js: ${SIZE} bytes gzipped (budget ${BUDGET})"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error file=tracking/script.js::Gzipped size ${SIZE} exceeds the ${BUDGET}-byte budget; update the documented size if this is intended."
            exit 1
          fi

      - name: Check the optional extras script stays inside its size budget
        run: |
          set -euo pipefail
          # Separate from the main tracker's budget: sites that do not opt in
          # never download it.
          BUDGET=2048
          SIZE=$(gzip -9 -c tracking/extras.js | wc -c)
          echo "tracking/extras.js: ${SIZE} bytes gzipped (budget ${BUDGET})"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error file=tracking/extras.js::Gzipped size ${SIZE} exceeds the ${BUDGET}-byte budget."
            exit 1
          fi

      - name: Ensure the tracking script has a single source
        run: |
          set -euo pipefail
          # tracking/script.js is compiled into the binary with include_str! and
          # served from /mallard.js.  A second copy under the embedded asset
          # directory would silently drift out of date.
          if [ -e src/dashboard/assets/mallard.js ]; then
            echo "::error file=src/dashboard/assets/mallard.js::Duplicate tracker copy found; tracking/script.js is the only source."
            exit 1
          fi
          grep -q 'include_str!' src/dashboard/mod.rs

# ── Job 5: Supply-chain policy (licenses, bans, sources) ──────────────────────
#
# Advisories are checked separately (security.yml): a freshly published RustSec
# entry for a dependency we cannot fix yet must not block unrelated work, but it
# must still be visible, so that workflow runs weekly and on any change to the
# lockfile.
#
# cargo-deny is installed at an explicit version rather than through
# EmbarkStudios/cargo-deny-action: releases before 0.19 cannot parse the
# CVSS 4.0 vectors that the RustSec database now contains, and the version the
# action bundles is not under our control.
  policy:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.19.4
      - name: cargo deny check bans licenses sources
        run: cargo deny --all-features check bans licenses sources

# ── Job 6: Code coverage ──────────────────────────────────────────────────────
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: lcov.info

# ── Job 7: Docker image build + container smoke test ──────────────────────────
#
# Builds the image from the Dockerfile and starts it with the production
# restrictions (read-only root, no capabilities, UID 65532, a fresh named
# volume), then asserts /health/detailed reports a behavioral extension version
# and that the extension still loads after a restart with no network.
# Building is the slow part (it compiles DuckDB); the GitHub Actions layer cache
# makes later runs fast.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: mallard-metrics:test
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,scope=docker-image,mode=max
      - name: Smoke-test the container
        run: scripts/docker-smoke.sh mallard-metrics:test

# ── Job 8: Deployment configuration ───────────────────────────────────────────
#
# Nothing else parses the compose files, the Caddyfile or the monitoring files,
# so a typo in any of them reached production before. The Caddy image is built from deploy/Dockerfile.caddy
# because the Caddyfile uses the Cloudflare DNS module, which stock Caddy lacks.
  deploy-config:
    name: Deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the compose files
        run: |
          set -euo pipefail
          MALLARD_SECRET=ci docker compose -f docker-compose.yml config --quiet
          DOMAIN=analytics.example.com ACME_EMAIL=ops@example.com \
          CLOUDFLARE_API_TOKEN=ci MALLARD_SECRET=ci MALLARD_ADMIN_PASSWORD=ci \
          MALLARD_METRICS_TOKEN=ci \
            docker compose -f deploy/docker-compose.production.yml config --quiet
      - name: Validate the Grafana dashboard JSON
        run: jq empty deploy/monitoring/grafana-dashboard.json
      # The rules are tested, not just parsed: the tests assert which alerts fire
      # for given series and what their text says.
      - name: Check and unit-test the Prometheus alert rules
        run: |
          set -euo pipefail
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" \
            prom/prometheus:v3.7.0 check rules /m/prometheus-rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" \
            prom/prometheus:v3.7.0 test rules /m/prometheus-rules.test.yml
      - name: Build Caddy with the Cloudflare module
        run: docker build -f deploy/Dockerfile.caddy -t mallard-caddy:ci .
      # The Cloudflare module checks the token's *format* when it provisions
      # (35-50 characters of [A-Za-z0-9_-], or a cfut_/cfat_ prefix), so a
      # placeholder like "ci" fails validation even though no API call is made.
      - name: Validate the Caddyfile
        run: |
          docker run --rm \
            -e DOMAIN=analytics.example.com -e ACME_EMAIL=ops@example.com \
            -e CLOUDFLARE_API_TOKEN=ci-placeholder-token-never-sent-anywhere \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            mallard-caddy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

# ── Job 9: Release binaries ───────────────────────────────────────────────────
#
# Builds the Linux release binaries the way release.yml does and smoke-tests
# them with the behavioral extension REQUIRED.
#
# glibc, not musl: the DuckDB community repository publishes no linux_*_musl
# build of `behavioral`, so a musl binary starts and ingests but answers 503 on
# every funnel, retention, session, sequence and flow request.
#
# The runner images are the oldest available (ubuntu-22.04, glibc 2.35) so the
# binary also runs on Debian 12 / distroless (glibc 2.36). check-binary-abi.sh
# verifies that and rejects any unexpected shared library.
#
# Each architecture builds and runs on a native runner, which also exercises the
# linux_arm64 extension.
  release-build:
    name: Release binary / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release
      - name: Check the binary runs on the container's C library
        run: scripts/check-binary-abi.sh target/release/mallard-metrics 2.36 3.4.30
      - name: Smoke-test the release binary
        env:
          MALLARD_REQUIRE_BEHAVIORAL: "1"
        run: scripts/smoke-test.sh target/release/mallard-metrics
