# Release pipeline for Mallard Metrics
#
# Triggered by pushing a semver tag:
#   git tag -a v0.2.0 -m "Release v0.2.0" && git push origin v0.2.0
#
# Job dependency graph:
#
#   validate ──┬──► ci (matrix) ──┬──► build-binaries (matrix) ──┬──► docker-image ────┬──► github-release
#              └──► security ────┘                               └────────────────────┘
#
# Linux binaries are glibc builds on the oldest runner image (ubuntu-22.04) and
# are smoke-tested with the DuckDB `behavioral` extension REQUIRED before they
# are archived. There are deliberately no musl builds: the extension is not
# published for musl, so such a binary would answer 503 on funnels, retention,
# sessions, sequences and flow.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"     # stable:      v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-release: v1.2.3-alpha.1

# Prevent concurrent releases for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimal default — individual jobs escalate only what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

# ── Job 1: Validate tag & extract metadata ────────────────────────────────────
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version:       ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          echo "::group::Tag metadata"
          printf 'Tag:        %s\n' "$TAG"

          # Validate the tag itself (not the stripped version) so that a
          # non-`v`-prefixed tag like "1.2.3" is rejected even if a future
          # trigger change (workflow_dispatch, etc.) bypasses the tag filter.
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?(\+[A-Za-z0-9.]+)?$'
          if [[ ! "$TAG" =~ $TAG_RE ]]; then
            echo "::error::Tag '$TAG' is not a valid semantic version."
            echo "Expected format: vX.Y.Z  or  vX.Y.Z-pre.1"
            exit 1
          fi

          VERSION="${TAG#v}"
          printf 'Version:    %s\n' "$VERSION"

          if [[ "$VERSION" =~ - ]]; then
            IS_PRE=true
          else
            IS_PRE=false
          fi

          printf 'Pre-release: %s\n' "$IS_PRE"
          echo "::endgroup::"

          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE"  >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        shell: bash
        run: |
          TAG_VER="${{ steps.meta.outputs.version }}"
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')

          echo "::group::Version consistency"
          printf 'Tag version:   %s\n' "$TAG_VER"
          printf 'Cargo version: %s\n' "$CARGO_VER"
          echo "::endgroup::"

          if [[ "$CARGO_VER" != "$TAG_VER" ]]; then
            echo "::error file=Cargo.toml::Cargo.toml version ($CARGO_VER) != tag ($TAG_VER)."
            echo "Update Cargo.toml to match the tag before releasing."
            exit 1
          fi
          echo "::notice::Cargo.toml version matches tag: $TAG_VER"

      - name: Verify CHANGELOG entry exists
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"

          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' entry in CHANGELOG.md."
            echo "Add release notes before tagging."
            exit 1
          fi
          echo "::notice::CHANGELOG.md entry found for v$VERSION"

# ── Job 2: Full CI gate (parallel matrix) ─────────────────────────────────────
  ci:
    name: CI / ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: "test"
            command: cargo test --locked --all-targets
          - name: "clippy"
            components: clippy
            command: cargo clippy --locked --all-targets --all-features -- -D warnings
          - name: "fmt"
            components: rustfmt
            command: cargo fmt -- --check
          - name: "doc"
            command: cargo doc --locked --no-deps
            rustdocflags: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          components: ${{ matrix.components || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          RUSTDOCFLAGS: ${{ matrix.rustdocflags || '' }}
          # Behavioral tests skip when the extension cannot be downloaded; a
          # release must not be cut from a run in which they were skipped.
          MALLARD_REQUIRE_BEHAVIORAL: "1"

# ── Job 3: Security audit ─────────────────────────────────────────────────────
#
# Unlike ci.yml, advisories ARE part of this gate: a release must not ship a
# dependency with a known vulnerability. cargo-deny is installed at an explicit
# version because releases before 0.19 cannot parse the CVSS 4.0 vectors now
# present in the RustSec database.
  security:
    name: Security audit (cargo-deny)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny@0.19.4
      - name: cargo deny check
        run: cargo deny --all-features check

# ── Job 4: Build release binaries (cross-platform matrix) ─────────────────────
  build-binaries:
    name: Build / ${{ matrix.target }}
    needs: [ci, security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux: glibc, built natively on the oldest available runner image so
          # the binary runs on anything from Ubuntu 22.04 / Debian 12 up (it
          # needs glibc >= 2.35) and in the distroless cc-debian12 image.
          # check-binary-abi.sh enforces the ceiling. No musl: see the header.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: mallard-metrics-x86_64-unknown-linux-gnu.tar.gz
            docker_arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: mallard-metrics-aarch64-unknown-linux-gnu.tar.gz
            docker_arch: arm64
          # Both Darwin builds run on macos-14 (Apple Silicon).  The aarch64
          # build is native; the x86_64 build cross-compiles using Apple's
          # system clang + universal SDK, which `cc-rs` and `cargo` drive
          # automatically from `--target x86_64-apple-darwin`.  This replaces
          # the previous `macos-13` Intel runner, which GitHub has deprecated
          # (`macos-13-us-default` is no longer available).
          - target: x86_64-apple-darwin
            os: macos-14
            archive: mallard-metrics-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: mallard-metrics-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Linux only: prove the binary can run on the container's C library, and
      # that it really serves the behavioral endpoints (installing the extension
      # over the network, as the container does on first start). The smoke test
      # uses GNU `date`, so it does not run on the macOS legs.
      - name: Check the binary's C library requirements
        if: matrix.docker_arch
        run: scripts/check-binary-abi.sh target/${{ matrix.target }}/release/mallard-metrics 2.36 3.4.30

      - name: Smoke-test the release binary
        if: matrix.docker_arch
        env:
          MALLARD_REQUIRE_BEHAVIORAL: "1"
        run: scripts/smoke-test.sh target/${{ matrix.target }}/release/mallard-metrics

      - name: Create archive
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/mallard-metrics"
          ARCHIVE="${{ matrix.archive }}"

          echo "::group::Binary details"
          ls -lh "$BINARY"
          file "$BINARY"
          echo "::endgroup::"

          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" mallard-metrics

          # sha256sum on Linux, shasum on macOS
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          echo "::notice::Archive created: $ARCHIVE ($(du -h "$ARCHIVE" | cut -f1))"

      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          retention-days: 90
          if-no-files-found: error

      # Upload raw Linux binaries for Docker image assembly
      - name: Upload Docker binary
        if: matrix.docker_arch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-bin-${{ matrix.docker_arch }}
          path: target/${{ matrix.target }}/release/mallard-metrics
          retention-days: 1
          if-no-files-found: error

# ── Job 5: Multi-arch Docker image ────────────────────────────────────────────
  docker-image:
    name: Docker image (GHCR)
    needs: [validate, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Expose the immutable image digest to downstream jobs (github-release
    # embeds it in release notes for verifiable pulls).
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download linux/amd64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-bin-amd64
          path: dist/amd64

      - name: Download linux/arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-bin-arm64
          path: dist/arm64

      - name: Prepare binaries
        run: |
          chmod +x dist/amd64/mallard-metrics dist/arm64/mallard-metrics
          echo "::group::Binary verification"
          file dist/amd64/mallard-metrics
          file dist/arm64/mallard-metrics
          ls -lh dist/*/mallard-metrics
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      # Gate: build the amd64 image exactly as it will be published (see
      # deploy/Dockerfile.release), load it locally and run the container smoke
      # test: production restrictions, behavioral extension installed and
      # reported by /health/detailed, and still loaded after a restart with no
      # network. Nothing is pushed unless this passes.
      - name: Build the amd64 image for the pre-push gate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64
          load: true
          push: false
          tags: mallard-metrics:gate

      - name: Smoke-test the image before publishing it
        run: scripts/docker-smoke.sh mallard-metrics:gate

      # SBOM and max-mode build provenance are attached to the image index by
      # BuildKit (no extra action). The SLSA attestation below is signed and
      # stored by GitHub on top of that.
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest Docker image provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate step summary
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          {
            echo "## Docker image published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Registry | \`ghcr.io/${{ github.repository }}\` |"
            echo "| Version  | \`${VERSION}\` |"
            echo "| Digest   | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo ""
            echo "### Pull commands"
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/${{ github.repository }}:${VERSION}"
            echo "docker pull ghcr.io/${{ github.repository }}:latest"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

# ── Job 6: Create GitHub release with all artifacts ───────────────────────────
  github-release:
    name: Create GitHub release
    needs: [validate, build-binaries, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts/
          pattern: mallard-metrics-*
          merge-multiple: true

      - name: Generate consolidated checksums
        shell: bash
        run: |
          cd release-artifacts
          echo "::group::Release artifacts"
          ls -lh
          echo "::endgroup::"

          # Combine per-archive checksums and verify
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "::notice::All checksums verified"

      - name: Attest binary provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/mallard-metrics-*.tar.gz

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          echo "::group::Extracting release notes for v$VERSION"

          awk "
            /^## \[$VERSION\]/ { found=1; next }
            found && /^## \[/  { exit }
            found              { print }
          " CHANGELOG.md > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "::error::Empty release notes extracted for $VERSION"
            echo "Ensure CHANGELOG.md has a non-empty ## [$VERSION] section."
            exit 1
          fi

          echo "Release notes preview:"
          cat release_notes.md
          echo "::endgroup::"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IS_PRE="${{ needs.validate.outputs.is_prerelease }}"
          TAG="v${VERSION}"
          DIGEST="${{ needs.docker-image.outputs.digest }}"
          [[ -z "$DIGEST" ]] && DIGEST="n/a"

          PRE_FLAG=""
          [[ "$IS_PRE" == "true" ]] && PRE_FLAG="--prerelease"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          # Append Docker pull instructions to release notes
          {
            echo ""
            echo "---"
            echo ""
            echo "### Docker"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/${{ github.repository }}:${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`. The image is based on"
            echo "distroless \`cc-debian12\` (glibc, UID 65532, no shell)."
            echo ""
            echo "Immutable digest (pin this in production):"
            echo ""
            echo "\`\`\`"
            echo "ghcr.io/${{ github.repository }}@${DIGEST}"
            echo "\`\`\`"
            echo ""
            echo "### Binaries"
            echo ""
            echo "- Linux \`x86_64\` and \`aarch64\` (\`*-unknown-linux-gnu\`): dynamically linked"
            echo "  against glibc 2.35 or newer (Debian 12+, Ubuntu 22.04+). Smoke-tested in CI"
            echo "  with the \`behavioral\` extension required."
            echo "- There is **no musl / Alpine build**. DuckDB's \`behavioral\` community extension"
            echo "  is not published for musl, so such a binary would serve everything except"
            echo "  funnels, retention, sessions, sequences and flow, which would answer 503."
            echo "  On Alpine, use the Docker image."
            echo "- macOS \`x86_64\` and \`aarch64\`: built, but not covered by the CI smoke test."
            echo "- Archives carry a build-provenance attestation:"
            echo "  \`gh attestation verify <archive> --repo ${{ github.repository }}\`"
            echo ""
            echo "### Checksums"
            echo ""
            echo "\`\`\`"
            cat release-artifacts/SHA256SUMS
            echo "\`\`\`"
          } >> release_notes.md

          # Idempotent: if a release already exists, update it in place
          if gh release view "$TAG" &>/dev/null; then
            echo "::warning::Release ${TAG} already exists — updating it."
            echo "::group::Updating GitHub release ${TAG}"
            gh release edit "$TAG" \
              $PRE_FLAG \
              --title "Mallard Metrics ${TAG}" \
              --notes-file release_notes.md

            gh release upload "$TAG" \
              --clobber \
              release-artifacts/mallard-metrics-*.tar.gz \
              release-artifacts/SHA256SUMS
            echo "::endgroup::"
            echo "::notice::GitHub release updated: $RELEASE_URL"
          else
            echo "::group::Creating GitHub release ${TAG}"
            gh release create "$TAG" \
              $PRE_FLAG \
              --title "Mallard Metrics ${TAG}" \
              --notes-file release_notes.md \
              release-artifacts/mallard-metrics-*.tar.gz \
              release-artifacts/SHA256SUMS
            echo "::endgroup::"
            echo "::notice::GitHub release created: $RELEASE_URL"
          fi

          # ── Step summary ──────────────────────────────────────────────────
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Pre-release | \`${IS_PRE}\` |"
            echo "| GitHub Release | [v${VERSION}](${RELEASE_URL}) |"
            echo "| Docker | \`ghcr.io/${{ github.repository }}:${VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo ""
            echo "### Artifacts"
            echo "\`\`\`"
            ls -lh release-artifacts/mallard-metrics-*.tar.gz
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
