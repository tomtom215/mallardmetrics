services:
  mallard-metrics:
    build: .
    image: mallard-metrics:local
    ports:
      - "8000:8000"
    volumes:
      - mallard-data:/data
    environment:
      - MALLARD_SECRET=${MALLARD_SECRET:?Set MALLARD_SECRET in .env or environment}
      - MALLARD_DATA_DIR=/data
      - MALLARD_ADMIN_PASSWORD=${MALLARD_ADMIN_PASSWORD:-}
      - MALLARD_LOG_FORMAT=${MALLARD_LOG_FORMAT:-text}
      - MALLARD_SECURE_COOKIES=${MALLARD_SECURE_COOKIES:-false}
      - MALLARD_METRICS_TOKEN=${MALLARD_METRICS_TOKEN:-}
      - MALLARD_DASHBOARD_ORIGIN=${MALLARD_DASHBOARD_ORIGIN:-}
      - MALLARD_TRUST_PROXY_HEADERS=${MALLARD_TRUST_PROXY_HEADERS:-false}
      - RUST_LOG=mallard_metrics=info
    restart: unless-stopped

    # The image ships a single static binary and writes only to /data.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      # /health/ready reports 503 until DuckDB is queryable, so it is the
      # correct probe for "ready to serve" rather than "process is alive".
      test: ["CMD", "/mallard-metrics", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mallard-data:
