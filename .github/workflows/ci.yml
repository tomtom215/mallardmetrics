# Continuous integration — enforces all quality gates.
#
# Jobs: test + clippy + fmt + doc + MSRV (matrix), security audit,
#       code coverage, Docker build & scan.
#
# Job dependency graph (all jobs run in parallel):
#
#   ci (5-entry matrix)
#   security
#   coverage
#   docker

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR — saves CI minutes when
# multiple commits are pushed in quick succession.  Main-branch pushes
# are NOT cancelled so merge builds always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── Job 1: Lint, test, and compile (parallel matrix) ──────────────────────────
jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            command: cargo test --locked --all-targets && cargo test --locked --doc
          - name: Clippy
            components: clippy
            command: cargo clippy --locked --all-targets -- -D warnings
          - name: Format
            components: rustfmt
            command: cargo fmt -- --check
          - name: Documentation
            command: cargo doc --no-deps
          - name: MSRV 1.94
            toolchain: "1.94.0"
            command: cargo build --locked
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: ${{ matrix.toolchain || '1.94.1' }}
          components: ${{ matrix.components || '' }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

# ── Job 2: Security audit ─────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          log-level: warn
          command: check
          arguments: --all-features

# ── Job 3: Code coverage ──────────────────────────────────────────────────────
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: "1.94.1"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@edba51d32f66935a112c0516fec65a13d420cbc6 # v2.68.17
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: lcov.info

# ── Job 4: Docker build & scan ────────────────────────────────────────────────
  docker:
    name: Docker build & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build Docker image
        run: docker build -t mallard-metrics:test .
      # Scan the built image for known CVEs.
      # FROM scratch means no OS packages — Trivy scans embedded binaries.
      # CRITICAL/HIGH vulnerabilities cause CI to fail; others are reported.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478 # v0.34.2
        with:
          image-ref: mallard-metrics:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
